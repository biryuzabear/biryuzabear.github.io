<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>biryuzabear</title>
<style>
  :root {
    --bg: #0d3438;
    --ink: #e0996a;
    --dim: #7fa8ac;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  main {
    padding: 2rem;
  }
  h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    letter-spacing: 0.04em;
    margin: 0 0 0.75rem;
  }
  p {
    color: var(--dim);
    margin: 0;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <h1>under construction</h1>
  <p>biryuzabear.github.io</p>
</main>
</body>
</html>
