<style>
  .ports {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    margin-top: 1.5rem;
  }
  .port {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    text-decoration: none;
    color: var(--ink);
    padding: 0.9rem 1rem;
  }
  .port .pin {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid var(--highlight);
    background: var(--void);
    flex: none;
  }
  .port:hover .pin, .port:focus-visible .pin { background: var(--highlight); }
  .port .label {
    font-family: var(--font-display);
    color: var(--highlight);
    font-size: 1rem;
    flex: 1;
  }
  .port .handle {
    font-size: 0.8rem;
    opacity: 0.6;
  }
</style>
</head>
